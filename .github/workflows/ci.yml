name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, dev]

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: HTTP MVP contract
        run: |
          docker build -t octocarte:mvp .
          python3 tests/http_mvp.py

  shim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask==3.1.3 requests==2.34.2 pytest
      - run: python -m pytest yt-dlp-shim/tests -q

  alacarte-extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sosjalapeno/alacarte
          ref: ef9b677c21b024a0acbf4f88d47c4ebff24802fa
          path: alacarte-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply optional catalog extension
        run: git -C alacarte-source apply ../integrations/alacarte/top-songs.patch
      - name: Check ALACarte extension
        working-directory: alacarte-source/backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:syntax
          node --test test/artistTopSongs*.test.mjs
