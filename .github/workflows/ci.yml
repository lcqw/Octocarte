name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build-and-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: HTTP MVP contract
        run: |
          docker build -t octocarte:mvp .
          python3 tests/http_mvp.py
          OCTOCARTE_TEST_SERVICE_AUTH=1 python3 tests/http_mvp.py
          OCTOCARTE_TEST_SERVICE_AUTH=1 OCTOCARTE_TEST_SINGLE_SONG=1 python3 tests/http_mvp.py
          python3 tests/test_secret_file.py
          python3 tests/test_simple_compose.py

  shim-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask==3.1.3 requests==2.34.2 pytest
      - run: python -m pytest yt-dlp-shim/tests -q

  alacarte-extension-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sosjalapeno/alacarte
          ref: ef9b677c21b024a0acbf4f88d47c4ebff24802fa
          path: alacarte-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply included ALACarte integration
        run: |
          git -C alacarte-source apply ../integrations/alacarte/top-songs.patch
          git -C alacarte-source apply ../integrations/alacarte/service-auth.patch
          git -C alacarte-source apply ../integrations/alacarte/wrapper-image.patch
          git -C alacarte-source apply ../integrations/alacarte/source-offer.patch
      - name: Check ALACarte extension
        working-directory: alacarte-source/backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:syntax
          node --test test/artistTopSongs*.test.mjs test/integrationAuth*.test.mjs test/octocarteSource.test.mjs

  verify-release-images:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify released images in the current account namespace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v$(cat VERSION)" --repo "$GITHUB_REPOSITORY" --pattern images.lock.json --dir "$RUNNER_TEMP/release"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path

          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release/images.lock.json').read_text())
          version = Path('VERSION').read_text().strip()
          assert release['version'] == version
          images = release['images']
          assert len(images) == 5
          owner = os.environ['GITHUB_REPOSITORY_OWNER'].lower()
          for entry in images.values():
              name = entry['tag'].rsplit('/', 1)[1]
              tag = f'ghcr.io/{owner}/{name}'
              subprocess.run(['docker', 'pull', tag], check=True)
              actual = json.loads(subprocess.check_output(['docker', 'image', 'inspect', tag], text=True))[0]
              assert actual['Id'] == entry['id'], f'Image content changed: {tag}'
              expected = entry['registryDigest'].split('@', 1)[1]
              assert any(d.split('@', 1)[1] == expected for d in actual['RepoDigests']), f'Manifest changed: {tag}'
              print(f'Verified {tag}: unchanged release image', flush=True)
          PYTHON
