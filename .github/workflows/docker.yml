name: Publish Octocarte prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octocarte-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Octocarte release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = pathlib.Path('VERSION').read_text().strip()
          if not re.fullmatch(r'0\.0\.5-alpha\.[1-9][0-9]*', version):
              raise SystemExit('This workflow currently publishes the 0.0.5 alpha series only.')
          if os.environ['RELEASE_REF'] != 'refs/tags/v' + version:
              raise SystemExit('Run this workflow on the matching immutable release tag.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_VERSION=' + version + '\n')
              env.write('REGISTRY_PREFIX=ghcr.io/' + os.environ['GITHUB_REPOSITORY_OWNER'].lower() + '\n')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test application and initialization
        run: |
          dotnet test --configuration Release
          python3 tests/test_simple_compose.py
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace existing release images
        run: |
          for image in octocarte octocarte-shim octocarte-alacarte octocarte-wrapper octocarte-init; do
            if docker manifest inspect "$REGISTRY_PREFIX/$image:$RELEASE_VERSION" >/dev/null 2>&1; then
              echo "Release image already exists; use a new release version."
              exit 1
            fi
          done
      - name: Build pinned source and prepare release artifacts
        run: |
          python3 scripts/build-compose-package.py --registry-prefix "$REGISTRY_PREFIX" --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/octocarte-release"
      - name: Test independent Navidrome integration and the stream contract
        env:
          OCTOCARTE_TEST_SERVICE_AUTH: '1'
        run: |
          OCTOCARTE_TEST_IMAGE="$REGISTRY_PREFIX/octocarte:$RELEASE_VERSION" python3 tests/http_mvp.py
          python3 tests/simple_compose_smoke.py --image-base "$REGISTRY_PREFIX/octocarte" --version "$RELEASE_VERSION" --source-archive "$RUNNER_TEMP/octocarte-release/alacarte-source.tar.gz"
      - name: Publish tested images and record registry digests
        run: |
          python3 scripts/publish-release-images.py "$RUNNER_TEMP/octocarte-release"
      - name: Pull back the published images and verify startup
        run: |
          for image in octocarte octocarte-shim octocarte-alacarte octocarte-wrapper octocarte-init; do
            docker image rm "$REGISTRY_PREFIX/$image:$RELEASE_VERSION"
            docker pull "$REGISTRY_PREFIX/$image:$RELEASE_VERSION"
          done
          python3 tests/simple_compose_smoke.py --image-base "$REGISTRY_PREFIX/octocarte" --version "$RELEASE_VERSION" --source-archive "$RUNNER_TEMP/octocarte-release/alacarte-source.tar.gz"
      - name: Create a draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$RELEASE_VERSION" --verify-tag --draft --prerelease --title "Octocarte $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md" "$RUNNER_TEMP/octocarte-release/"*.tar.gz "$RUNNER_TEMP/octocarte-release/"*.json "$RUNNER_TEMP/octocarte-release/compose.yml" "$RUNNER_TEMP/octocarte-release/env.example" "$RUNNER_TEMP/octocarte-release/images.env" "$RUNNER_TEMP/octocarte-release/SHA256SUMS"
