name: octocarte
services:
  initialize:
    image: ${SHIM_IMAGE:?Load the package images first}
    pull_policy: never
    network_mode: none
    user: "0:0"
    entrypoint: [python, /initialize.py]
    environment:
      NAVIDROME_UID: ${NAVIDROME_UID:-1000}
      NAVIDROME_GID: ${NAVIDROME_GID:-10}
    volumes:
      - type: bind
        source: ${DATA_DIR:?Set an absolute DATA_DIR}
        target: /state
      - type: bind
        source: ./initialize.py
        target: /initialize.py
        read_only: true
        bind: {create_host_path: false}
